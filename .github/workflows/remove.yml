name: Android Build and Release

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose build type (debug or release)'
        required: true
        default: 'debug'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing. Generating it..."
            ./gradlew wrapper
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add gradle/wrapper/gradle-wrapper.jar
            git commit -m "Add missing gradle-wrapper.jar"
            git push
          fi

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assemble${{ github.event.inputs.build_type }} --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v3
        with:
          name: android-apk
          path: app/build/outputs/apk/${{ github.event.inputs.build_type }}/app-${{ github.event.inputs.build_type }}.apk

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.build_type }}-build-${{ github.run_id }}
          release_name: ${{ github.event.inputs.build_type }} Build ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/${{ github.event.inputs.build_type }}/app-${{ github.event.inputs.build_type }}.apk
          asset_name: app-${{ github.event.inputs.build_type }}.apk
          asset_content_type: application/vnd.android.package-archive
